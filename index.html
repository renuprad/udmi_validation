<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON Data Display</title>
    <script>
        let myGlobalValue = [];
        const jsonUrl = '/udmi_validation/validation_report.json'; 
        let myValue = [];    
    </script>

</head>

<body>
    <h1>Selected JSON Content</h1>
    <p>Correct Devices: <span id="correct_devices"></span></p>    
    <p>Missing Devices: <span id="missing_devices"></span></p>
    <p>Error Devices: <span id="error_devices"></span></p>


    <script>
        // Use the relative path to your JSON file within the repo/GitHub Page


        fetch(jsonUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json(); // Parse the response as JSON
            })
            .then(data => {
                // Selectively display the content
                console.log('The validation file is read:', data);
                myValue = document.getElementById('correct_devices').textContent = data.summary.correct_devices;
                myGlobalValue = myValue;
                console.log('The Global Value 1 is now:', myGlobalValue);
                console.log(myValue.length);
                console.log(myGlobalValue.length);
                document.getElementById('missing_devices').textContent = data.summary.missing_devices;
                document.getElementById('error_devices').textContent = data.summary.error_devices;
                
                 console.log('There correct devices list is:', myValue);
                 console.log(myValue.length);
            })
            .catch(error => {
                console.error('There has been a problem with your fetch operation:', error);
            })
            
           
            console.log('The Global Value 2 is now:', myGlobalValue);
          
            
    </script>
    
    <script src="script.js"></script>
    
     <h1>1D Array Data</h1>
     <!-- This is where the table will be inserted -->
     <div id="table-container"></div>
    <div id="data-container" data-array-values = 'correct_devices'></div>
    
</body>
</html>

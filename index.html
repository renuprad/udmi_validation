<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON Data Display</title>
</head>
<body>
    <h1>Selected JSON Content</h1>
    <p>Correct Devices: <span id="correct_devices"></span></p>
    <p>Missing Devices: <span id="missing_devices"></span></p>
    <p>Error Devices: <span id="error_devices"></span></p>

    <script>
        // Use the relative path to your JSON file within the repo/GitHub Page
        const jsonUrl = './udmi_validation/blob/main/validation_report.json'; 

        fetch(jsonUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json(); // Parse the response as JSON
            })
            .then(data => {
                // Selectively display the content
                document.getElementById('correct_devices').textContent = validation_report.user.name;
                document.getElementById('missing_devices').textContent = data.user.location;
                document.getElementById('error_devices').textContent = validation_report.user.location;
            })
            .catch(error => {
                console.error('There has been a problem with your fetch operation:', error);
            });
    </script>
</body>
</html>
